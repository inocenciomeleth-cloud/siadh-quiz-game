<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIADH Quiz Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .quiz-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 500px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .question {
      font-size: 18px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: #4a90e2;
      color: white;
      transition: 0.3s;
    }

    button:hover {
      background: #357abd;
    }

    #result {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="quiz-box">
    <h1>Nursing Quiz Game</h1>

    <div class="question">
      A client with SIADH is admitted to the medical unit.<br><br>
      Which physician prescription should the nurse question?
    </div>

    <button onclick="checkAnswer('A')">A. Restrict fluids to 800 mL/day</button>
    <button onclick="checkAnswer('B')">B. Administer hypertonic saline as prescribed</button>
    <button onclick="checkAnswer('C')">C. Monitor neurologic status every 2 hours</button>
    <button onclick="checkAnswer('D')">D. Encourage oral fluid intake of 3 L/day</button>

    <div id="result"></div>
  </div>

  <script>
    function checkAnswer(answer) {
      const result = document.getElementById('result');

      if (answer === 'D') {
        result.innerHTML = '✅ Correct! SIADH causes water retention, so fluids should usually be restricted.';
        result.style.color = 'green';
      } else {
        result.innerHTML = '❌ Wrong! Correct answer: D. Encourage oral fluid intake of 3 L/day';
        result.style.color = 'red';
      }
    }
  </script>

</body>
</html>
